<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>茶と粕｜八女茶ラーメン・酒粕ラーメン</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">茶と粕。</div>
  
      <nav class="nav">
        <a href="index.html">top</a>
        <a href="#products">products</a>
        <a href="#contact">info</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <header class="hero">
    <h1>八女茶と酒粕</h1>
    <p>〜美と健康を考えた、新しい一杯〜</p>
  </header>

  <!-- Concept -->
  <section class="concept">
    <h2 class="section-title">CONCEPT</h2>
    <p>
      忙しい毎日の中でも、<br>
      罪悪感なく食べられるラーメンを。
    </p>
  </section>

  <!-- Products -->
  <section id="products">
    <h2 class="section-title">PRODUCTS</h2>
    <div class="products">


      <!-- お茶ラーメン -->
      <div class="card">
        <img src="img/tya.jpg" alt="八女茶ラーメン">
        <h3>八女茶ラーメン</h3>
        <p>香り高い八女茶 × 美容ラーメン</p>
        <a href="yame.html" class="detail-btn">詳細を見る</a>
      </div>
    
      <!-- 酒粕ラーメン -->
      <div class="card">
        <img src="img/IMG_2318.jpg" alt="酒粕ラーメン">
        <h3>酒粕ラーメン</h3>
        <p>発酵の力で内側から美しく</p>
        <a href="sakekasu.html" class="detail-btn">詳細を見る</a>
      </div>
    
    </div>
  </section>

  <section id="contact">
    <h2 class="section-title">info</h2>
  
    <form class="contact-form">
      <div class="form-group">
        <label>お名前</label>
        <input type="text" placeholder="例：小川　ハチ">
      </div>
  
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" placeholder="example@mail.com">
      </div>
  
      <div class="form-group">
        <label>お問い合わせ内容</label>
        <textarea rows="5" placeholder="ご質問・ご相談はこちら"></textarea>
      </div>
  
      <button type="submit">送信する</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      © 2026 茶と粕。
    </div>
  </footer>
</body>
</html>
